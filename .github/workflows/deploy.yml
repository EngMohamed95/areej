name: Deploy Areej to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: areej-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment secrets
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD_PRODUCTION: ${{ secrets.DB_PASSWORD_PRODUCTION }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        run: |
          missing=0
          for key in FTP_PASSWORD DB_HOST DB_NAME DB_USER DB_PASSWORD_PRODUCTION ADMIN_PIN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build frontend and PHP API configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PRODUCTION }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        run: npm run build

      - name: Verify deployment bundle
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/catalog.php
          test -f dist/api/users.php
          test -f dist/api/config.php

      - name: Deploy dist to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.areej-sa.net
          username: u177160961.areej
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json

      - name: Synchronize product image paths
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        run: node scripts/sync-production-images.mjs https://areej-sa.net

      - name: Verify production API
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors 'https://areej-sa.net/api/catalog.php?since=0')"
          node -e 'const data=JSON.parse(process.argv[1]); const linked=data.products?.filter((p)=>p.imageUrl?.startsWith("/tenants/areej/products/")).length || 0; if (!data.success || !Array.isArray(data.products) || linked < 73) process.exit(1); console.log(`Production healthy: ${data.products.length} products, ${linked} product images, catalog v${data.version}`)' "$response"
